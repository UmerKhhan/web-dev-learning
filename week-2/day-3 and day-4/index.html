<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Web App</title>
</head>
<body>
    <header class="nav-bar">
        <nav class="searchcity">
            <input type="text" class="city" id="city" placeholder="Enter City... ">
            <button id="search">Search</button>
        </nav>
        <div class="time"></div>
    </header>
    <span class="handle-error"></span>
    <section class="webcard">
        <img src="./assets/hero-sec-bg.jpg" alt="" class="hero-sec-bg-img">
        <div class="hero">
            <div class="todaydata">
                <span class="tempmax">Highest Temp: </span>
                <span class="tempmin">Lowest Temp: </span>
                <span class="sunrise">Sunrise: </span>
                <span class="sunset">Sunset: <span>     
            </div>
            <div class="container">
                <div class="location">
                    <span class="city">city, </span>
                    <span class="country">country</span>
                </div>
                <div class="temps">
                    <h1 class="temp">temp</h1>
                    <h6 class="tempfeelslike">feels like</h6>
                </div>
            </div>
            <div class="description">
                <span class="status">status</span>
                <span class="humidity">Humidity</span>
                <span class="windspeed">Windspeed</span>
            </div>
        </div>
    </section>

    <section class="forcastcard">
        <div class="">

            <div class="futuretemps">
                <div class="">
                    <img src="https://openweathermap.org/img/wn/01n.png" alt="" id='weathericonimg'>
                    <span id="temp">temp</span>
                    <span id="time">time</span>
                </div>
                <div class="">
                    <img src="https://openweathermap.org/img/wn/01d.png" alt="" id='weathericonimg'>
                    <span id="temp">temp</span>
                    <span id="time">time</span>
                </div>
                <div class="">
                    <img src="https://openweathermap.org/img/wn/01d.png" alt="" id='weathericonimg'>
                    <span id="temp">temp</span>
                    <span id="time">time</span>
                    
                </div>
                <div class="">
                    <img src="https://openweathermap.org/img/wn/01n.png" alt="" id='weathericonimg'>
                    <span id="temp">temp</span>
                    <span id="time">time</span>
                    
                </div>
                <div class="">
                    <img src="https://openweathermap.org/img/wn/01d.png" alt="" id='weathericonimg'>
                    <span id="temp">temp</span>
                    <span id="time">time</span>
                    
                </div>
                <div class="">
                    <img src="https://openweathermap.org/img/wn/01d.png" alt="" id='weathericonimg'>
                    <span id="temp">temp</span>
                    <span id="time">time</span>

                </div>
            </div>
        </div>
    </section>


    <img src="" alt="">
    <script src="script.js"></script>
</body>
</html>
